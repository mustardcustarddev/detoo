# Builds the documentation site in docs/site, and publishes it to GitHub Pages.
#
# The command reference is generated from the tools' own help, so the site is
# rebuilt when the tools change, as well as when the site does.  Pull requests
# build and check the site without publishing it.
#
# Before the first deployment, set Settings › Pages › Source to GitHub Actions.

name: Site

on:
  push:
    branches: [main]
    paths: &paths
      - docs/site/**
      - internal/**
      - cmd/**
      - tools/sitegen/**
      - go.mod
      - go.sum
      - .github/workflows/site.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - run: npm ci
      - run: go test ./tools/sitegen/
        working-directory: .
      - run: npm run build
      - run: npm run check-links

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  # Only main is published, so a manual run on another branch builds and stops.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and one in progress is allowed to finish.  The
    # group is the deploy job's alone, so pull requests never queue behind it,
    # or displace a pending deployment of main.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
